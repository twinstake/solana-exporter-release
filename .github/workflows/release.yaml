name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        # https://github.com/asymmetric-research/solana-exporter/tags
        description: Upstream tag to build and publish, e.g. v3.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG is already released"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: asymmetric-research/solana-exporter
          ref: ${{ inputs.tag }}
          path: upstream
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: upstream/go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: upstream
          args: release --clean --config ../.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}
